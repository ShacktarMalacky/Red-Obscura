name: Red-Obscura CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: red-obscura-rules-test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: red-obscura-rules-test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: red-obscura-rules-test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm install --prefix functions
      - run: npm run build --prefix functions
      - run: npm install --no-save --legacy-peer-deps @firebase/rules-unit-testing firebase-tools
      - run: npx firebase emulators:exec --only firestore,auth,functions --project red-obscura-rules-test 'node --test tests/firestore.rules.test.mjs && npm run test:integration --prefix functions'
